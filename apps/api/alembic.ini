# Alembic configuration for the Burnt Jacket API.
#
# The database URL is intentionally NOT set here. It is resolved at runtime
# from application settings (which read the DATABASE_URL environment variable)
# inside migrations/env.py, so there is no connection string committed to the
# repository and local/staging/production all use the same code path.

[alembic]
script_location = migrations
prepend_sys_path = .
# Use OS path separator; keeps versions/ tidy on all platforms.
version_path_separator = os

[post_write_hooks]
# (none configured)

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
